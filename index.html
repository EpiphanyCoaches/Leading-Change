djusting to change takes time, and it's okay to experience challenges along the way.\n\nRemember, the goal at this stage isn't to have all the solutions. It's to help people feel supported, heard, and understood as they work through the change.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"AmuNb8DrnXA6As245","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">The chaos stage is marked by confusion, frustration, or low morale. People are trying to adjust to the change but may feel uncertain or stuck.\u003cbreak time=\"0.5s\"/>As a leader, it's important to show empathy by listening to people's concerns and helping them feel heard and understood. You don't need all the answers—sometimes, simply listening is enough.\u003cbreak time=\"0.5s\"/>Here are some strategies to help support your team through this stage.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Lead with empathy. Acknowledge that change can be uncomfortable and emotionally draining. You don't need to solve every problem right away. Sometimes, simply recognizing how people are feeling can make a big difference.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Ask, don't assume. Check in regularly with your team. Ask how they're doing, what challenges they're facing, and what support they might need.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>And finally, provide consistent reassurance. Remind your people that adjusting to change takes time, and it's okay to experience challenges along the way.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Remember, the goal at this stage isn't to have all the solutions. It's to help people feel supported, heard, and understood as they work through the change.\u003c/prosody>\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"The chaos stage is marked by confusion,","startTime":0.079,"finishTime":2.589},{"text":"frustration,","startTime":2.799,"finishTime":3.64},{"text":"or low morale.","startTime":3.839,"finishTime":4.86},{"text":"People are trying to adjust to the change","startTime":5.239,"finishTime":7.46},{"text":"but may feel uncertain or stuck.","startTime":7.599,"finishTime":9.77},{"text":"As a leader,","startTime":10.67,"finishTime":11.46},{"text":"it's important to show empathy by listening to people's concerns","startTime":11.63,"finishTime":15.25},{"text":"and helping them feel heard and understood.","startTime":15.43,"finishTime":18.09},{"text":"You don't need all the answers.","startTime":18.35,"finishTime":19.93},{"text":"Sometimes,","startTime":20.389,"finishTime":20.649},{"text":"simply listening is enough.","startTime":21.11,"finishTime":22.569},{"text":"Here are some strategies to help support your team through this stage.","startTime":23.43,"finishTime":27.239},{"text":"Lead with empathy,","startTime":28.889,"finishTime":30.079},{"text":"acknowledge that change can be uncomfortable and emotionally draining.","startTime":30.37,"finishTime":34.369},{"text":"You don't need to solve every problem right away.","startTime":34.689,"finishTime":37.56},{"text":"Sometimes,","startTime":38.169,"finishTime":38.669},{"text":"simply recognizing how people are feeling can make a big difference.","startTime":38.93,"finishTime":42.11},{"text":"Ask,","startTime":44.369,"finishTime":44.689},{"text":"don't assume.","startTime":44.81,"finishTime":45.59},{"text":"Check in regularly with your team.","startTime":46.009,"finishTime":47.819},{"text":"Ask how they're doing,","startTime":48.169,"finishTime":49.319},{"text":"what challenges they're facing,","startTime":49.529,"finishTime":51.11},{"text":"and what support they might need.","startTime":51.33,"finishTime":52.97},{"text":"And finally,","startTime":54.49,"finishTime":55.36},{"text":"provide consistent reassurance.","startTime":55.65,"finishTime":57.479},{"text":"Remind your people that adjusting to change takes time,","startTime":57.81,"finishTime":60.99},{"text":"and it's OK to experience challenges along the way.","startTime":61.25,"finishTime":64.309},{"text":"Remember,","startTime":65.919,"finishTime":66.519},{"text":"the goal at this stage isn't to have all the solutions,","startTime":66.69,"finishTime":69.91},{"text":"it's to help people feel supported,","startTime":70.169,"finishTime":72.12},{"text":"heard,","startTime":72.37,"finishTime":72.809},{"text":"and understood as they work through the change.","startTime":73.01,"finishTime":75.47}]}},"BZsyLpykEnSLSzRTb":{"_id":"BZsyLpykEnSLSzRTb","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1256256,"uploadedFileName":"Echo-en-ThreeStagesofChangeReview-10282026.mp3","uploadedFileNameExtension":".mp3","duration":52.3113333},"dates":{"dateCreated":"2026-10-28T15:44:19.003Z","dateModified":"2026-10-28T15:45:06.290Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"As we've explored, change isn't a straight line. Everyone experiences change differently, and people may move through the stages at different speeds. Some may even move back and forth between stages as they adjust.\n\nThe key takeaway is that effective leaders adapt their approach based on where their people are in the change curve.\n\nDuring resistance, focus on providing clarity to help people understand the change. During chaos, lead with empathy, making sure people feel heard and supported. And during integration, provide encouragement and direction, celebrating progress and reinforcing new habits.\n\nRemember, leading change isn't about moving everyone through the process at the same pace. It's about recognizing what people need and providing the right support at the right time.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"gjQFWrhNW5qQYQdyX","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">As we've explored, change isn't a straight line. Everyone experiences change differently, and people may move through the stages at different speeds. Some may even move back and forth between stages as they adjust.\u003cbreak time=\"0.5s\"/>The key takeaway is that effective leaders adapt their approach based on where their people are in the change curve.\u003cbreak time=\"0.5s\"/>During resistance, focus on providing clarity to help people understand the change. During chaos, lead with empathy, making sure people feel heard and supported. And during integration, provide encouragement and direction, celebrating progress and reinforcing new habits.\u003cbreak time=\"0.5s\"/>Remember, leading change isn't about moving everyone through the process at the same pace. It's about recognizing what people need and providing the right support at the right time.\u003c/prosody>\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"As we've explored,","startTime":0.119,"finishTime":1.33},{"text":"change isn't a straight line.","startTime":1.6099999999999999,"finishTime":3.309},{"text":"Everyone experiences change differently,","startTime":3.609,"finishTime":6},{"text":"and people may move through the stages at different speeds.","startTime":6.25,"finishTime":9.6},{"text":"Some may even move back and forth between stages as they adjust.","startTime":9.989,"finishTime":13.689},{"text":"The key takeaway is that effective leaders adapt their approach","startTime":14.568999999999999,"finishTime":18.329},{"text":"based on where their people are in the change curve.","startTime":18.329,"finishTime":20.95},{"text":"During resistance,","startTime":21.77,"finishTime":22.75},{"text":"focus on providing clarity to help people understand the change.","startTime":23.25,"finishTime":27.35},{"text":"During chaos,","startTime":27.69,"finishTime":28.719},{"text":"lead with empathy,","startTime":29,"finishTime":30.03},{"text":"making sure people feel heard and supported.","startTime":30.209,"finishTime":32.83},{"text":"And during integration,","startTime":33.049,"finishTime":34.409},{"text":"provide encouragement and direction,","startTime":34.81,"finishTime":36.61},{"text":"celebrating progress and reinforcing new habits.","startTime":36.889,"finishTime":39.97},{"text":"Remember,","startTime":40.93,"finishTime":41.52},{"text":"leading change isn't about moving everyone through the process at the same pace.","startTime":41.77,"finishTime":46.63},{"text":"It's about recognizing what people need and providing","startTime":46.93,"finishTime":50.06},{"text":"the right support at the right time.","startTime":50.06,"finishTime":52.009}]}},"EqoeRSBnt3z9rTmuu":{"_id":"EqoeRSBnt3z9rTmuu","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1351872,"uploadedFileName":"Echo-en-TheChangeCurve3StagesofChange-10282026.mp3","uploadedFileNameExtension":".mp3","duration":56.3002916},"dates":{"dateCreated":"2026-10-28T15:25:42.802Z","dateModified":"2026-10-28T15:25:48.726Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"Let's explore the change curve and how you can support your people. The change curve can be broken down into 3 main stages of change.\n\nThe first stage of change people will experience is the resistance stage. In the resistance stage people often initially react to change with hesitation or pushback, experiencing uncertainty and discomfort about leaving familiar routines behind.\n\nThe next stage is the chaos stage. During the chaos stage individuals may feel overwhelmed or confused as they navigate the uncertainty and complexities involved in adopting the new changes.\n\nFinally, people end up in the integration stage. During integration,  individuals begin to fully embrace the change, incorporating new behaviors and processes comfortably into their daily routines, leading to improved performance and stability.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"7FFoXsu8M47mojiQK","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">Let's explore the change curve and how you can support your people. The change curve can be broken down into 3 main stages of change.\u003cbreak time=\"0.5s\"/>The first stage of change people will experience is the resistance stage. In the resistance stage people often initially react to change with hesitation or pushback, experiencing uncertainty and discomfort about leaving familiar routines behind.\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>The next stage is the chaos stage. During the chaos stage individuals may feel overwhelmed or confused as they navigate the uncertainty and complexities involved in adopting the new changes.\u003cbreak time=\"0.3s\"/>\u003cbreak time=\"0.5s\"/>Finally, people end up in the integration stage. During integration,  individuals begin to fully embrace the change, incorporating new behaviors and processes comfortably into their daily routines, leading to improved performance and stability.\u003c/prosody>\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Let's explore the change curve and how you can support your people.","startTime":0.09,"finishTime":4.03},{"text":"The change curve can be broken down into 3 main stages of change.","startTime":4.409,"finishTime":8.689},{"text":"The first stage of change people will experience is the resistance stage.","startTime":9.55,"finishTime":14.17},{"text":"In the resistance stage,","startTime":14.47,"finishTime":15.71},{"text":"people often initially react to change with hesitation or pushback,","startTime":15.829,"finishTime":20.03},{"text":"experiencing uncertainty and discomfort about","startTime":20.389,"finishTime":23.35},{"text":"leaving familiar routines behind.","startTime":23.35,"finishTime":25.329},{"text":"The next stage is the chaos stage.","startTime":26.659,"finishTime":28.959},{"text":"During the chaos stage,","startTime":29.34,"finishTime":30.5},{"text":"individuals may feel overwhelmed or confused as they navigate the","startTime":30.739,"finishTime":34.7},{"text":"uncertainty and complexities involved in adopting the new changes.","startTime":34.7,"finishTime":38.659},{"text":"Finally,","startTime":39.95,"finishTime":40.529},{"text":"people end up in the integration stage.","startTime":40.79,"finishTime":43.189},{"text":"During integration,","startTime":43.549,"finishTime":44.77},{"text":"individuals begin to fully embrace the change,","startTime":45.27,"finishTime":48.009},{"text":"incorporating new behaviors and processes","startTime":48.31,"finishTime":50.83},{"text":"comfortably into their daily routines,","startTime":50.83,"finishTime":53.18},{"text":"leading to improved performance and stability.","startTime":53.43,"finishTime":55.99}]}},"Q3dwjJbneFSc3ESBP":{"_id":"Q3dwjJbneFSc3ESBP","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"image","mimetype":"image/jpeg","status":"online","fileSizeInBytes":635178,"uploadedFileName":"photo-1600603855527-d2ed85e33e1e.jpg","height":1046,"uploadedFileNameExtension":".jpg","width":1680},"dates":{"dateCreated":"2025-05-26T18:34:52.427Z","dateModified":"2025-05-26T18:34:52.427Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","jobId":"rNbwjevJKdGcCTjdA","thumbnail":"txLKunmzNjYDL78rn"},"WEBZhqdHGy3SS3Qh7":{"_id":"WEBZhqdHGy3SS3Qh7","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":1711296,"uploadedFileName":"Echo-en-TheChangeCurveResistanceStage-10282026.mp3","uploadedFileNameExtension":".mp3","duration":71.2789166},"dates":{"dateCreated":"2026-10-28T15:30:25.909Z","dateModified":"2026-10-28T15:30:30.605Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"In the resistance stage, people are often skeptical or hesitant. They may not fully understand why the change is happening or how it will affect them.\n\nAs a leader, one of the most important things you can do at this stage is provide clarity. Help your people understand the purpose of the change, what it means for them, and what they can expect moving forward.\n\nHere are some best practices to help guide your people through this stage.\n\nTell the story of the change. Clearly explain what's changing, why it's happening, and how it will benefit the team or organization.\n\nAnticipate common concerns. Address questions and fears early, whether they're related to past experiences, uncertainty about roles, or feeling left out of the process.\n\nAnd finally, be visible and available. Show consistent support for the change, make time for questions, and demonstrate your commitment through your actions.\n\nRemember, providing clarity and building trust early can help people feel more comfortable and prepared to move forward.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"nueeffEE5ft6JwxGa","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">In the resistance stage, people are often skeptical or hesitant. They may not fully understand why the change is happening or how it will affect them.\u003cbreak time=\"0.5s\"/>As a leader, one of the most important things you can do at this stage is provide clarity. Help your people understand the purpose of the change, what it means for them, and what they can expect moving forward.\u003cbreak time=\"0.5s\"/>Here are some best practices to help guide your people through this stage.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Tell the story of the change. Clearly explain what's changing, why it's happening, and how it will benefit the team or organization.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Anticipate common concerns. Address questions and fears early, whether they're related to past experiences, uncertainty about roles, or feeling left out of the process.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>And finally, be visible and available. Show consistent support for the change, make time for questions, and demonstrate your commitment through your actions.\u003cbreak time=\"0.5s\"/>\u003cbreak time=\"0.2s\"/>\u003cbreak time=\"0.5s\"/>Remember, providing clarity and building trust early can help people feel more comfortable and prepared to move forward.\u003c/prosody>\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"In the resistance stage,","startTime":0.009,"finishTime":1.49},{"text":"people are often skeptical or hesitant.","startTime":1.69,"finishTime":4.21},{"text":"They may not fully understand why the change is happening","startTime":4.57,"finishTime":7.75},{"text":"or how it will affect them.","startTime":7.889,"finishTime":9.21},{"text":"As a leader,","startTime":10.14,"finishTime":11.05},{"text":"one of the most important things you can do at this stage is provide clarity,","startTime":11.359,"finishTime":15.89},{"text":"help your people understand the purpose of the change,","startTime":16.18,"finishTime":18.93},{"text":"what it means for them,","startTime":19.219,"finishTime":20.409},{"text":"and what they can expect moving forward.","startTime":20.7,"finishTime":22.739},{"text":"Here are some best practices to help guide your people through this stage.","startTime":23.62,"finishTime":27.639},{"text":"Tell the story of the change.","startTime":29.219,"finishTime":31},{"text":"Clearly explain what's changing,","startTime":31.239,"finishTime":33.08},{"text":"why it's happening,","startTime":33.34,"finishTime":34.369},{"text":"and how it will benefit the team or","startTime":34.659,"finishTime":37.06},{"text":"organization.","startTime":37.169,"finishTime":37.419},{"text":"Anticipate common concerns.","startTime":38.939,"finishTime":41.18},{"text":"Address questions and fears early,","startTime":41.409,"finishTime":43.639},{"text":"whether they're related to past experiences,","startTime":43.9,"finishTime":46.36},{"text":"u Created":"2026-10-28T15:42:13.632Z","dateModified":"2026-10-28T15:42:17.847Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"The integration stage is where change starts to stick. People are beginning to form new habits and build momentum, but they still need leadership support.\n\nAt this stage, it's important to provide encouragement and direction. Help your people recognize the progress they're making, reinforce positive behaviours, and provide guidance as they adjust to new ways of working.\n\nHere are some strategies to help your team move from integration to the new status quo.\n\nAcknowledge and celebrate effort. Recognize small wins and achievements to help build confidence and maintain momentum.\n\nProvide clear direction. Continue offering guidance, setting expectations, and helping your team stay focused as new habits take shape.\n\nAnd finally, champion your team. Recognize those who are embracing the change and encourage them to share their experiences to inspire others.\n\nRemember, consistent encouragement and clear direction can help turn new behaviours into lasting habits.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"wsw9CBqX49yeWQsRR","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">The integration stage is where change starts to stick. People are beginning to form new habits and build momentum, but they still need leadership support.\u003cbreak time=\"0.5s\"/>At this stage, it's important to provide encouragemen me":23.44},{"text":"Here are some strategies to help your team","startTime":25.02,"finishTime":27.35},{"text":"move from integration to the new status quo.","startTime":27.35,"finishTime":30.329},{"text":"Acknowledge and celebrate effort.","startTime":31.85,"finishTime":33.669},{"text":"Recognize small wins and achievements to","startTime":34.229,"finishTime":36.65},{"text":"help build confidence and maintain momentum.","startTime":36.65,"finishTime":39.369},{"text":"Provide clear direction,","startTime":40.979,"finishTime":42.63},{"text":"continue offering guidance,","startTime":43.069,"finishTime":44.45},{"text":"setting expectations,","startTime":44.669,"finishTime":46.119},{"text":"and helping your team stay focused as new habits take shape.","startTime":46.43,"finishTime":50.15},{"text":"And finally,","startTime":51.63,"finishTime":52.5},{"text":"champion your team.","startTime":52.669,"finishTime":53.689},{"text":"Recognize those who are embracing the change","startTime":54.25,"finishTime":56.81},{"text":"and encourage them to share their experiences to inspire others.","startTime":56.99,"finishTime":60.669},{"text":"Remember,","startTime":62.279,"finishTime":62.88},{"text":"consistent encouragement and clear direction can help","startTime":63.069,"finishTime":66},{"text":"turn new behaviors into lasting habits.","startTime":66,"finishTime":68.599}]}},"ZA7wYf2537aLuWJEu":{"_id":"ZA7wYf2537aLuWJEu","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":355392,"uploadedFileName":"Echo-en-LeadingChangeBenefitsBestPractices-10282026.mp3","uploadedFileNameExtension":".mp3","duration":14.7765833},"dates":{"dateCreated":"2026-10-28T16:43:50.659Z","dateModified":"2026-10-28T16:43:52.436Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"We know that \"intentionally leading\" change reduces resistance, builds trust, and increases your team’s willingness to adapt and contribute positively to the change.\nHelping our people process how they think and feel through change is critical.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"cqnSMMELQNG6grxpv","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">\u003cprosody rate=\"0.9\">We know that \"intentionally leading\" change reduces resistance, builds trust, and increases your team’s willingness to adapt and contribute positively to the change.\u003c/prosody>\u003c/voice>\u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">Helping our people process how they think and feel through change is critical.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"We know that intentionally leading change reduces resistance,","startTime":0.129,"finishTime":3.799},{"text":"builds trust,","startTime":4.01,"finishTime":5.03},{"text":"and increases your team's willingness to adapt","startTime":5.25,"finishTime":7.949},{"text":"and contribute positively to the change.","startTime":7.949,"finishTime":10.399000000000001},{"text":"Helping our people process how they think and feel through change is critical.","startTime":10.729,"finishTime":14.51}]}},"awYzp4hP6Nq7Ni9xZ":{"_id":"awYzp4hP6Nq7Ni9xZ","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"image","mimetype":"image/jpeg","status":"online","fileSizeInBytes":1884009,"uploadedFileName":"photo-1513151233558-d860c5398176.jpg","height":1120,"uploadedFileNameExtension":".jpg","width":1680},"dates":{"dateCreated":"2025-05-08T17:19:45.725Z","dateModified":"2025-05-08T17:19:45.725Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","jobId":"8u23dZJGkQPf6NerL","thumbnail":"coPBoy9nABraji65E"},"d6kHNc9Ra8pS7Qf2H":{"_id":"d6kHNc9Ra8pS7Qf2H","_siteID":"g7KiRFsys4vhsx3dA","data":{"attributes":{"type":"audio","mimetype":"audio/mpeg","status":"online","fileSizeInBytes":811584,"uploadedFileName":"Echo-en-LeadingChangeCoreConcepts-10282026.mp3","uploadedFileNameExtension":".mp3","duration":33.775},"dates":{"dateCreated":"2026-10-28T15:19:25.016Z","dateModified":"2026-10-28T15:19:27.947Z"},"users":{"_userCreatorID":"xpAePQ3mCWbJ9zYyH","_userModifierID":"xpAePQ3mCWbJ9zYyH"}},"isBuiltin":false,"isSampleData":false,"isVisible":true,"workspaceId":"ScpqTofGheQCozvfg","source":"textToSpeech","textToSpeechData":{"prompt":"Leading change effectively starts with understanding how both you and your team respond to change. Everyone experiences change differently, and recognizing these differences can help you provide the right support.\n\nAs a leader, it's important to clearly communicate why the change is happening and why it matters. Involving your people in the process, listening to their concerns, and helping them work through their reactions can make change feel more manageable.\n\nUltimately, effective change leadership is about helping people feel informed, supported, and confident as they move forward.","voiceCode":"en-US-EchoTurboMultilingualNeural","language":"en","originalResourceId":"GLjwf494vYwLtnJ5T","ssml":"\u003cspeak \n            xmlns=\"http://www.w3.org/2001/10/synthesis\"\n            xmlns:mstts=\"http://www.w3.org/2001/mstts\"\n            xmlns:emo=\"http://www.w3.org/2009/10/emotionml\" \n            version=\"1.0\" \n            xml:lang=\"en\"\n          >\n            \u003cvoice name=\"en-US-EchoTurboMultilingualNeural\">Leading change effectively starts with understanding how both you and your team respond to change. Everyone experiences change differently, and recognizing these differences can help you provide the right support.\u003cbreak time=\"0.5s\"/>As a leader, it's important to clearly communicate why the change is happening and why it matters. Involving your people in the process, listening to their concerns, and helping them work through their reactions can make change feel more manageable.\u003cbreak time=\"0.5s\"/>Ultimately, effective change leadership is about helping people feel informed, supported, and confident as they move forward.\u003c/voice>\n          \u003c/speak>"},"captionData":{"status":"success","captions":[{"text":"Leading change effectively starts with understanding how both","startTime":0.17,"finishTime":3.25},{"text":"you and your team respond to change.","startTime":3.25,"finishTime":5.489},{"text":"Everyone experiences change differently,","startTime":5.73,"finishTime":7.929},{"text":"and recognizing these differences can help you provide the right support.","startTime":8.13,"finishTime":11.609},{"text":"As a leader,","startTime":12.439,"finishTime":13.199},{"text":"it's important to clearly communicate why the","startTime":13.329,"finishTime":15.409},{"text":"change is happening and why it matters.","startTime":15.409,"finishTime":17.79},{"text":"Involving your people in the process,","startTime":18.049,"finishTime":19.93},{"text":"listening to their concerns,","startTime":20.129,"finishTime":21.569},{"text":"and helping them work through their reactions","startTime":21.77,"finishTime":23.649},{"text":"can make change feel more manageable.","startTime":23.649,"finishTime":25.629},{"text":"Ultimately,","startTime":26.54,"finishTime":27.209},{"text":"effective change leadership is about helping people feel informed,","startTime":27.54,"finishTime":30.92},{"text":"supported,","startTime":31.26,"finishTime":31.659},{"text":"and confident as they move forward.","startTime":31.67,"finishTime":33. children\":[{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"The chaos stage is marked by confusion, frustration, or low morale. People are trying to adjust to the change but may feel uncertain or stuck.\",\"type\":\"text\",\"version\":1}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"As a leader, it's important to show empathy by listening to people's concerns and helping them feel heard and understood. You don't need all the answers—sometimes, simply listening is enough.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Here are some strategies to help support your team through this stage.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Lead with empathy. Acknowledge that change can be uncomfortable and emotionally draining. You don't need to solve every problem right away. Sometimes, simply recognizing how people are feeling can make a big difference.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Ask, don't assume. Check in regularly with your team. Ask how they're doing, what challenges they're facing, and what support they might need.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"And finally, provide consistent reassurance. Remind your people that adjusting to change takes time, and it's okay to experience challenges along the way.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Remember, the goal at this stage isn't to have all the solutions. It's to help people feel supported, heard, and understood as they work through the change.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","featureAdoption":{"isAddingPauses":true,"isUsingMultipleVoices":false,"isAdjustingSpeed":true},"promptText":"The chaos stage is marked by confusion, frustration, or low morale. People are trying to adjust to the change but may feel uncertain or stuck.\n\nAs a leader, it's important to show empathy by listening to people's concerns and helping them feel heard and understood. You don't need all the answers—sometimes, simply listening is enough.\n\nHere are some strategies to help support your team through this stage.\n\nLead with empathy. Acknowledge that change can be uncomfortable and emotionally draining. You don't need to solve every problem right away. Sometimes, simply recognizing how people are feeling can make a big difference.\n\nAsk, don't assume. Check in regularly with your team. Ask how they're doing, what challenges they're facing, and what support they might need.\n\nAnd finally, provide consistent reassurance. Remind your people that adjusting to change takes time, and it's okay to experience challenges along the way.\n\nRemember, the goal at this stage isn't to have all the solutions. It's to help people feel supported, heard, and understood as they work through the change.","voiceCodeUsed":"en-US-EchoTurboMultilingualNeural","jobId":"9Fnw5XdWBbPRNQ3i5"}},"FsZJDZtDtB8Jaxv5X":{"_id":"FsZJDZtDtB8Ja ren\":[],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Remember, leading change isn't about moving everyone through the process at the same pace. It's about recognizing what people need and providing the right support at the right time.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","promptText":"As we've explored, change isn't a straight line. Everyone experiences change differently, and people may move through the stages at different speeds. Some may even move back and forth between stages as they adjust.\n\nThe key takeaway is that effective leaders adapt their approach based on where their people are in the change curve.\n\nDuring resistance, focus on providing clarity to help people understand the change. During chaos, lead with empathy, making sure people feel heard and supported. And during integration, provide encouragement and direction, celebrating progress and reinforcing new habits.\n\nRemember, leading change isn't about moving everyone through the process at the same pace. It's about recognizing what people need and providing the right support at the right time.","featureAdoption":{"isAdjustingSpeed":true,"isUsingMultipleVoices":false,"isAddingPauses":false},"voiceCodeUsed":"en-US-EchoTurboMultilingualNeural"}},"nueeffEE5ft6JwxGa":{"_id":"nueeffEE5ft6JwxGa","data":{"attributes":{"displayOrder":1,"template":"resourceSlide","locale":"en","title":"Gallup Strengths Model: Four Dimensions of Leadership","upload":"WEBZhqdHGy3SS3Qh7"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay {\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Anticipate common concerns. Address questions and fears early, whether they're related to past experiences, uncertainty about roles, or feeling left out of the process.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"And finally, be visible and available. Show consistent support for the change, make time for questions, and demonstrate your commitment through your actions.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"type\":\"textToSpeechBreak\",\"version\":1,\"duration\":0.2}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}},{\"children\":[{\"detail\":0,\"format\":0,\"mode\":\"normal\",\"style\":\"\",\"text\":\"Remember, providing clarity and building trust early can help people feel more comfortable and prepared to move forward.\",\"type\":\"text\",\"version\":1}],\"direction\":null,\"format\":\"\",\"indent\":0,\"type\":\"textToSpeech\",\"version\":1,\"configuration\":{\"voiceCode\":\"en-US-EchoTurboMultilingualNeural\",\"rate\":0.9}}],\"direction\":\"ltr\",\"format\":\"\",\"indent\":0,\"type\":\"root\",\"version\":1}}","featureAdoption":{"isAddingPauses":true,"isUsingMultipleVoices":false,"isAdjustingSpeed":true},"promptText":"In the resistance stage, people are often skeptical or hesitant. They may not fully understand why the change is happening or how it will affect them.\n\nAs a leader, one of the most important things you can do at this stage is provide clarity. Help your people understand the purpose of the change, what it means for them, and what they can expect moving forward.\n\nHere are some best practices to help guide your people through this stage.\n\nTell the story of the change. Clearly explain what's changing, why it's happening, and how it will benefit the team or organization.\n\nAnticipate common concerns. Address questions and fears early, whether they're related to past experiences, uncertainty about roles, or feeling left out of the process.\n\nAnd finally, be visible and available. Show consistent support for the change, make time for questions, and demonstrate your commitment through your actions.\n\nRemember, providing clarity and building trust early can help people feel more comfortable and prepared to move forward.","voiceCodeUsed":"en-US-EchoTurboMultilingualNeural","jobId":"2hTiygs6tmHvw3aHL"}},"wsw9CBqX49yeWQsRR":{"_id":"wsw9CBqX49yeWQsRR","data":{"attributes":{"displayOrder":1,"template":"resourceSlide","locale":"en","title":"Gallup Strengths Model: Four Dimensions of Leadership","upload":"YKoQxupWpQzzMDLty"},"assessment":{"graded":false,"showFeedback":true},"video":{"autoPlay":true,"background":{"applyBackgroundImageToWholePage":false,"backgroundImageOpacity":100,"backgroundImageScaling":"fill","backgroundImagePosition":"middleCenter","backgroundColor":"koantic(light2, 0, 1)"},"overlays":[{"customStyle":{"font":{"bold":false,"size":20,"italic":false,"underline":false},"fill":{"color":"koantic(dark2, 0, 1)","type":"color"},"fontColor":"rgb(255, 255, 255)","type":"svgShape","textAlignment":"center","border":{"color":"koantic(accent1, 5, 1)","size":0,"left":true,"top":true,"bottom":true,"right":true},"verticalAlignment":"middle
